spring.config.import=optional:file:./.env[.properties]
spring.application.name=ambmao
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=ambmao
spring.flyway.default-schema=ambmao
spring.flyway.schemas=ambmao
spring.flyway.create-schemas=true
spring.mvc.hiddenmethod.filter.enabled=true
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
ambmao.profissional-inicial.nome=${AMBMAO_PROFISSIONAL_NOME:}
ambmao.profissional-inicial.email=${AMBMAO_PROFISSIONAL_EMAIL:}
ambmao.profissional-inicial.senha=${AMBMAO_PROFISSIONAL_SENHA:}
